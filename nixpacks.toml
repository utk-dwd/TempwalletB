[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x", "python3", "gcc", "gnumake", "pkg-config", "libusb1", "openssl", "systemd"]

[phases.install]
cmds = [
  "node scripts/verify-railway.cjs",
  "pnpm i --frozen-lockfile || (echo 'Frozen lockfile failed, regenerating...' && pnpm i && echo 'Lockfile regenerated successfully')"
]

[phases.build]
cmds = [
  "cd packages/prisma && pnpm prisma generate || (echo 'First attempt failed, trying with explicit schema path...' && pnpm prisma generate --schema=./schema.prisma) || (echo 'Using placeholder DATABASE_URL for generation...' && DATABASE_URL='postgresql://placeholder:5432/placeholder' pnpm prisma generate --schema=./schema.prisma) || (echo 'All generation attempts failed, but continuing build...' && exit 0)",
  "pnpm run deploy:build"
]

[env]
PRISMA_SCHEMA = "packages/prisma/schema.prisma"

[start]
cmd = "pnpm run deploy:start"