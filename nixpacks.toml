[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x", "python3", "gcc", "gnumake", "pkg-config", "libusb1", "openssl", "systemd"]

[phases.install]
cmds = [
  "node scripts/verify-railway.cjs",
  "pnpm i --frozen-lockfile || (echo 'Frozen lockfile failed, regenerating...' && pnpm i && echo 'Lockfile regenerated successfully')"
]

[phases.build]
cmds = [
  "pnpm --filter @tempwallet/prisma run generate || DATABASE_URL='postgresql://placeholder' pnpm --filter @tempwallet/prisma run generate",
  "pnpm run deploy:build"
]

[env]
PRISMA_SCHEMA = "packages/prisma/schema.prisma"

[start]
cmd = "pnpm run deploy:start"